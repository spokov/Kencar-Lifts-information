<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote Elevator Call</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb;overflow:hidden}.header{background:#0d6efd;color:#fff;padding:12px;font-size:22px;font-weight:700}.sidebar{background:#fff;border-right:1px solid #ddd;height:calc(100vh - 54px);overflow:auto}.viewer{height:calc(100vh - 54px)}iframe{width:100%;height:100%;border:0}.elevator-item.active{background:#e7f1ff}.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block}.online{background:#198754}.offline{background:#dc3545}@media(max-width:768px){.sidebar{height:40vh}.viewer{height:60vh}}</style></head><body><div class="header text-center">Remote Elevator Call</div><div class="container-fluid"><div class="row"><div class="col-lg-3 col-md-4 p-0 sidebar"><div class="p-3"><input id="search" class="form-control mb-2" placeholder="Search elevator..."><div class="d-grid gap-2 mb-3"><button class="btn btn-primary" onclick="addElevator()">Add Elevator</button><button class="btn btn-success" onclick="exportData()">Export</button><button class="btn btn-secondary" onclick="document.getElementById('fileImport').click()">Import</button></div><input type="file" id="fileImport" accept=".json" hidden><div id="elevatorList"></div></div></div><div class="col-lg-9 col-md-8 p-0 viewer"><iframe id="frame"></iframe></div></div></div><script>let elevators=[];const ls=localStorage.getItem('elevators');if(ls){elevators=JSON.parse(ls);render();}else{fetch('elevators.json').then(r=>r.json()).then(d=>{elevators=d;save();render();if(d.length)loadElevator(d[0]);}).catch(()=>render());}function save(){localStorage.setItem('elevators',JSON.stringify(elevators));}function render(filter=''){const c=document.getElementById('elevatorList');c.innerHTML='';elevators.filter(x=>x.name.toLowerCase().includes(filter.toLowerCase())).forEach((e,i)=>{const d=document.createElement('div');d.className='card mb-2 elevator-item';d.innerHTML=`<div class="card-body"><div class="d-flex justify-content-between"><strong>${e.name}</strong><span class="status-dot ${e.status.toLowerCase()}"></span></div><small>${e.status}</small><div class="mt-2 d-flex flex-wrap gap-1"><button class="btn btn-sm btn-warning" onclick="event.stopPropagation();editElevator(${i})">Edit</button><button class="btn btn-sm btn-success" onclick="event.stopPropagation();toggleStatus(${i})">Status</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteElevator(${i})">Delete</button></div></div>`;d.onclick=()=>loadElevator(e,d);c.appendChild(d);});}function loadElevator(e,el){document.querySelectorAll('.elevator-item').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('frame').src=e.url;}function addElevator(){let name=prompt('Elevator Name');if(!name)return;let url=prompt('Elevator URL');if(!url)return;elevators.push({id:Date.now(),name,status:'Online',url});save();render();}function editElevator(i){let n=prompt('Name',elevators[i].name);if(!n)return;let u=prompt('URL',elevators[i].url);if(!u)return;elevators[i].name=n;elevators[i].url=u;save();render();}function toggleStatus(i){elevators[i].status=elevators[i].status==='Online'?'Offline':'Online';save();render();}function deleteElevator(i){if(confirm('Delete elevator?')){elevators.splice(i,1);save();render();}}function exportData(){const b=new Blob([JSON.stringify(elevators,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='elevators.json';a.click();}document.getElementById('fileImport').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{try{elevators=JSON.parse(x.target.result);save();render();}catch(err){alert('Invalid JSON');}};r.readAsText(f);});document.getElementById('search').addEventListener('input',e=>render(e.target.value));</script></body></html>
