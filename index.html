<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Elevator Call</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f7fb;height:100vh;overflow:hidden}
.header{background:#0d6efd;color:white;padding:12px;font-weight:700}
.sidebar{background:white;border-right:1px solid #ddd;height:calc(100vh - 56px);overflow:auto}
.elevator-item{cursor:pointer}
.elevator-item.active{background:#e7f1ff}
.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
.online{background:#1bb55c}.offline{background:#dc3545}
.viewer{height:calc(100vh - 56px)}
iframe{width:100%;height:100%;border:0;background:white}
@media(max-width:768px){.sidebar{height:auto;max-height:40vh}.viewer{height:60vh}}
</style>
</head>
<body>
<div class="header text-center">Remote Elevator Call</div>
<div class="container-fluid">
<div class="row">
<div class="col-lg-3 col-md-4 p-0 sidebar">
<div class="p-3">
<input id="search" class="form-control mb-3" placeholder="Търсене на асансьор...">
<div id="elevatorList"></div>
</div>
</div>
<div class="col-lg-9 col-md-8 p-0 viewer">
<iframe id="frame" src="about:blank"></iframe>
</div>
</div>
</div>
<script>
let elevators=[];
fetch('elevators.json')
.then(r=>r.json())
.then(data=>{elevators=data;render(data);if(data.length)load(data[0]);});
function render(list){
const c=document.getElementById('elevatorList');
c.innerHTML='';
list.forEach(e=>{
const d=document.createElement('div');
d.className='list-group-item elevator-item';
d.innerHTML=`<span class="status-dot ${e.status.toLowerCase()}"></span><strong>${e.name}</strong><br><small>${e.status}</small>`;
d.onclick=()=>load(e,d);
c.appendChild(d);
});}
function load(e,el){
document.querySelectorAll('.elevator-item').forEach(x=>x.classList.remove('active'));
if(el)el.classList.add('active');
document.getElementById('frame').src=e.url;
}
document.getElementById('search').addEventListener('input',e=>{
const q=e.target.value.toLowerCase();
render(elevators.filter(x=>x.name.toLowerCase().includes(q)));
});
</script>
</body>
</html>
